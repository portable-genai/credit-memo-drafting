# Narrative quality floors for the memo prose, per promotion bundle. Owner: model risk.
#
# These are the only numbers in this service that say how GOOD the memo's prose has to be, as
# opposed to whether its arithmetic reproduces, its covenants are right, its citations resolve
# or its identifiers are masked. Everything else the eval scores is deterministic and binary.
# The prose is the one output a credit officer actually reads, and until this file existed
# nothing measured it at all.
#
# Two bars, and the difference between them is the point:
#   floor   below this the profile MUST NOT serve this vertical. Not "degraded". Unfit.
#   target  at or above this the profile is at full quality. Between the two is DEGRADED:
#           usable, and visibly worse, which is the band the portability claim describes in
#           adjectives and which nothing measured until there was a floor.
#
# The vertical is named for the promotion bundle rather than the repository, because the bundle
# is what a promotion is granted against.
schema = "quality-floors/v1"
owner = "model risk (the model-quality-gate promotion authority)"

[verticals.doc2-credit-memo]
floor = 0.65
target = 0.88
note = """A memo a credit officer reads before signing, and a committee reads after. A weak \
narrative here is not caught by a reviewer downstream: the reviewer IS the reader."""
