[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "credit-memo-drafting"
version = "0.0.1"
description = "B2 Credit-Memo / Underwriting Assistant — grounded synthesis that turns a borrower's financial statements and filings into a cited credit memo with covenants, risk flags and peer comps, built ports-and-adapters on the Gemini Enterprise Agent Platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ashish Awasthi" }]
keywords = ["credit", "underwriting", "covenants", "credit-memo", "gemini", "adk", "gcp", "bfsi", "commercial-banking"]

# Core deps are framework-light so the domain + on-prem/test profile install without
# any Google Cloud SDK. The managed-service adapters live in the [gcp] extra.
dependencies = [
  # Shared commons, pinned by tag; no build-time coupling. Public repos, so CI
  # installs them with zero credentials. hex-service-kit: outbound S2S, fail-closed net defaults,
  # StrEnum base, to_jsonable, hash-chained WORM audit. agent-eval-kit: the Hrz4
  # promotion-gate client the platform eval adapter uses.
  "hex-service-kit @ git+https://github.com/portable-genai/hex-service-kit@v0.0.1",
  "agent-eval-kit @ git+https://github.com/portable-genai/agent-eval-kit@v0.0.1",
  # review-kit: the producer half of rule R8 (route a requires_human_review escalation to the
  # Hrz7 maker-checker console the same way from every producer). Public, pinned by tag, zero-cred.
  "review-kit @ git+https://github.com/portable-genai/review-kit@v0.0.1",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "tenacity>=8.3",
  "typer>=0.12",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-dateutil>=2.9",
  # Shared jurisdiction PII pattern pack (SG/HK/JP/AU rows + checksum validators + RE2-safe
  # forms + the two-part safety scorer). Pure stdlib, zero deps, public. Pinned by tag: the
  # local redactor, the DLP custom info types and the eval leak check all read ONE source, so
  # a pack fix is a version bump instead of a copy that drifts (retires the C4 regex copy).
  "pii-kit @ git+https://github.com/portable-genai/pii-kit@v0.0.1",
  # Borrower document upload (the audience-data path): python-multipart is FastAPI's
  # parser for the multipart route (the route cannot even be built without it) and
  # pypdf recovers per-page text from uploaded PDF financials.
  "python-multipart>=0.0.9",
  "pypdf>=4.0",
]

[project.optional-dependencies]
# Pinned per mid-2026 research. ADK 2.0 was a breaking release => pin exactly.
gcp = [
  "google-adk==2.7.1",
  "google-genai>=1.21",
  "google-cloud-aiplatform[agent_engines,adk,evaluation]>=1.158.0",
  "google-cloud-documentai>=2.31",
  "google-cloud-discoveryengine>=0.13",
  "google-cloud-bigquery>=3.25",
  "google-cloud-dlp>=3.20",
  "google-cloud-logging>=3.11",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-gcp-trace>=1.7",
  "a2a-sdk>=0.2",
  "mcp>=1.2",
]
# Demo tooling is a PINNED, opt-in extra (F2): the served-page walkthrough and the
# headless-browser anti-rot test need it, while the day-one offline gate (D3) must stay
# installable and green without downloading a browser binary.
demo = [
  "playwright==1.62.0",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff==0.16.3",
  "mypy>=1.10",
  "types-PyYAML",
  "respx>=0.21",
]

[project.scripts]
credit-memo = "credit_memo.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_memo"]

[tool.hatch.metadata]
# Allow the pii-kit git+https direct reference in project.dependencies (public repo, pinned
# by tag; the lockfile resolves it to an exact SHA so the no-build-time-coupling property holds).
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Presentation/demo scripts embed long HTML/CSS string literals; line length there
# hurts more than it helps. The shipped package (src) and tests stay strict.
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires live Google Cloud credentials (deselect with -m 'not integration')",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
