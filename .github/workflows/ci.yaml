name: CI

# Lint + type-check + tests on the LOCAL profile, so CI needs NO Google Cloud credentials
# and NO google-cloud-* packages. The local profile is a WORKING offline stack (SDK-free),
# so the suite exercises the same adapters the offline CLI runs. Integration deselected.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # This repository's own prefix. It read LOAN_DOC_PROFILE, which nothing here resolves:
  # the file was adapted from loan-document-intelligence and this line came with it. An
  # unset CREDIT_MEMO_PROFILE is carried as "no choice was made" rather than defaulting to
  # local, so every job below ran without the profile it believed it had named.
  CREDIT_MEMO_PROFILE: local

jobs:
  lint-type-test:
    name: ruff + mypy + pytest (local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (dev only, no GCP SDK)
        # Proves the domain + onprem profile install and run with no google-cloud-* deps.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock && pip install -e . --no-deps

      - name: Ruff (lint)
        run: ruff check src tests eval

      - name: Ruff (format check)
        run: ruff format --check src tests eval

      - name: Mypy (type-check)
        run: mypy src

      - name: Pytest (unit + contract, integration deselected)
        run: pytest -m 'not integration' -q

      - name: End-to-end local smoke (offline, no GCP SDK)
        # Proves the local profile runs the whole pipeline and returns a real artifact.
        # Invokes THIS repository's CLI. It previously invoked
        # `loan-document-intelligence process examples/application.json`: a console script
        # this package does not install, against a file this tree does not contain. The
        # step could only ever have failed, and never ran to say so, because GitHub Actions
        # are disabled across the fleet by portfolio decision. Kept identical to `make memo`.
        run: credit-memo build "Acme Manufacturing Pte Ltd" --sector manufacturing --jurisdiction SG

      - name: Eval gate (offline driver)
        run: python eval/run_eval.py

      - name: Demo anti-rot and portability proofs
        run: |
          PYTHONPATH=src:scripts python scripts/demo_selftest.py
          PYTHONPATH=src python scripts/portability_demo.py

      # F2, the half that had never run. Playwright is pinned in the [demo] extra and compiled
      # into requirements-demo.lock; the browser BINARY is a network download, which is why the
      # offline gate must not depend on it and why it is fetched HERE instead. The demo lock is
      # compiled from the same pyproject.toml as the dev lock installed above, so installing it
      # on top cannot pull a commons backwards.
      - name: Install the pinned headless-browser toolchain
        run: |
          pip install -r requirements-demo.lock
          python -m playwright install --with-deps chromium

      - name: Served demo UI in a real headless Chromium (a SKIP fails this job)
        # tests/browser/test_served_demo_ui.py skips LOUDLY when the extra or the browser is
        # absent, so a fork's day-one offline gate still passes without either. Both are
        # installed one step above, so no honest reason to skip is left HERE, and
        # DEMO_BROWSER_REQUIRED says exactly that to the suite itself: with it set, an absent
        # extra or a failed launch FAILS rather than skipping, so the evidence can no longer
        # stop running behind a green tick -- which is how this suite reported green for as
        # long as it existed, without ever loading a page. The grep stays as the outer belt
        # because it also catches "no tests ran".
        run: |
          set -o pipefail
          DEMO_BROWSER_REQUIRED=1 CREDIT_MEMO_PROFILE=local python -m pytest tests/browser -q -rs | tee browser-evidence.log
          if grep -qE 'skipped|no tests ran' browser-evidence.log; then
            echo "the served-browser evidence did not run; it proves nothing" >&2
            exit 1
          fi

  supply-chain:
    name: dependency audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      # Audit the committed lockfiles so the result matches exactly what CI and the image
      # install. --no-deps: the locks are fully compiled, so audit those exact versions.
      - name: pip-audit (dev + gcp + demo lockfiles)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements-dev.lock --disable-pip --no-deps
          pip-audit -r requirements-gcp.lock --disable-pip --no-deps
          pip-audit -r requirements-demo.lock --disable-pip --no-deps
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      # A plain hard gate, matching pip-audit above and the fleet standard in
      # ai-act-conformity-pack/.github/workflows/ui-gate.yaml. No allowlist and no
      # expiry date: an exception that outlives the advisory it excepted is a gate that
      # only pretends to gate, and a date literal in CI rots silently.
      - name: npm audit (high severity fails the build)
        working-directory: ui
        run: npm audit --audit-level=high

  ui-build:
    name: Next.js console builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install + build the thin console
        # npm audit alone cannot catch a UI-breaking dependency bump; only a real build can.
        working-directory: ui
        run: |
          npm ci
          npm run lint
          npm test
          NEXT_TELEMETRY_DISABLED=1 npm run build

      - name: Assert the built console can hydrate
        # A green build proves nothing about hydration: the CSP header is byte-identical whether
        # or not the served script tags carry its nonce. This starts the BUILT server and reads
        # the document, which is the only check that can tell a live console from dead markup.
        working-directory: ui
        run: npm run assert-hydratable

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.8"
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
